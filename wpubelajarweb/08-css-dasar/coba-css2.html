<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba CSS - Selector & Property</title>
    <style>
        h1 {
            font-size: 120px;
            font-family: arial;
            color: goldenrod;
            text-align: center;
        }

        p {
            color: navy;
            font-size: 30px;
            text-align: center;
        }

        .p2 {
            color: darkgreen;
        }

        #judul {
            text-transform: uppercase;
        }

        #garis-bawah {
            text-decoration: underline;
        }

        .cetak-miring {
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1 id="judul" class="p2 cetak-miring">Hello World</h1>
    <p id="garis-bawah" class="cetak-miring">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorem facilis quae quod repellendus quibusdam, qui repellat? Similique explicabo omnis earum?
    </p>
    <p class="p2">
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Vero, nihil.
    </p>
    
</body>
</html>
