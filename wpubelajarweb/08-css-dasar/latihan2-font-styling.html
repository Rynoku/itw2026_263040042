<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playwrite+IT+Trad:wght@100..400&display=swap');

        body {
            font-family: "Playwrite IT Trad", cursive;
            font-weight: bold;
            color: rgb(61, 61, 61);
            text-align: center;
        }

        h1 {
            font-size: 48px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-shadow: 2px 3px 0 rgb(165, 165, 165);
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: rgb(165, 165, 165);
        }

        .main {
            font-size: 22px;
            line-height: 2,2;
            word-spacing: 5px;    
        }

        span {
            color: rgb(105, 105, 105);
            text-decoration: line-through;
        }

        .end {
            font-size: 12px;
            letter-spacing: 2px;
            color: gray;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <h1>PAMIT TANPA SUARA</h1>
    <p class="main">
        "Beberapa perpisahan terjadi begitu saja,<br> tanpa pertengkaran, tanpa kata pamit.<br> Hanya dua orang yang <span>perlahan</span> saling melupakan."
    </p>
    <p class="end">
        - rynoku feat. fakhri ibadil kirom
    </p>
    
</body>
</html>
