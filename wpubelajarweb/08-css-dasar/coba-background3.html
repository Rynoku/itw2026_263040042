<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>
    <style>
        body {
            background-color: rgb(83, 83, 202);
            background-image: linear-gradient(goldenrod, gold, white, lightblue);
            height: 100vh;
        }

        .kotak1 {
            width: 300px;
            height: 300px;
            background-color: bisque;
            background-image: linear-gradient(to bottom, pink, purple);
        }

        .kotak2 {
            width: 300px;
            height: 300px;
            background-color: bisque;
            background-image: radial-gradient(pink, purple);
        }

        .kotak3 {
            width: 300px;
            height: 300px;
            background-color: bisque;
            background-image: conic-gradient(pink, purple);
        }
    </style>
    <!-- ada attribute to right, to left, to bottom, to top, to right top, to left top & deg untuk linear-gradient -->
     <!-- ada % untuk panjag color pada linear-gradient -->
</head>
<body>

    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
    
</body>
</html>
