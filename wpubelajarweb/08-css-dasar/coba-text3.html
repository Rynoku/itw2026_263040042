<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Text - Text Overflow & Shadow</title>
    <style>
        p {
            font-size: 20px;
            white-space: nowrap;
            width: 300px;
            background-color: goldenrod;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        h1 {
            font-size: 100px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            /* text-shadow: 5px 10px 5px goldenrod, 0 -10px 5px gray; */
            text-shadow: 5px 5px 0 goldenrod;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: crimson;
            text-decoration-skip-ink: none;
        }
    </style>
</head>
<body>

    <h1>Hello CSS!</h1>
    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Qui ex suscipit possimus et fuga, aut nisi iusto quod quaerat iste praesentium. Vero, tenetur ipsa debitis earum amet soluta ullam reiciendis?
    </p>
    
</body>
</html>
