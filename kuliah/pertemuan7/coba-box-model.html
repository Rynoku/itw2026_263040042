<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Box Model</title>
    <style>
        .kotak1 {
            width: 100px;
            height: 100px;
            background-color: orange;
            margin: 50px auto;
            padding: 20px;
            border: 5px solid purple;
        }

        .kotak2 {
            width: 150px;
            height: 150px;
            background-color: salmon;
            margin: 0px;
        }

        .kotak3 {
            width: 200px;
            height: 200px;
            background-color: orange;
            margin: auto;
            padding: 20px;
            border: 5px solid red;
            box-sizing: border-box;
        }

        .kotak4 {
            width: 200px;
            height: 200px;
            background-color: salmon;
            margin: auto;
            padding: 20px;
            border: 5px solid red;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="kotak1">lorem10</div>
    <div class="kotak2">kotak 2</div>
    <div class="kotak3">kotak 3</div>
    <div class="kotak4">kotak 4</div>
    
</body>
</html>
