<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba CSS 2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">

    <style>
        h1 {
            color: gold;
            font-family: "Anton", 'Courier New', arial, monospace;
            text-align: center;
            font-size: 30px;
        }

        .p1 {
            color: green;
            font-family: "Noto Sans KR", Arial, Helvetica, sans-serif;
            }

        .p2 {
            color: pink;
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;
            }
    </style>
</head>

<body>
    
    <h1>Hello ITW</h1>
    <p class="p1">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Perferendis libero, quo harum omnis quidem porro nesciunt tempore excepturi adipisci laboriosam?
    </p>

    <p class="p2">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Odio, deleniti!
    </p>

</body>
</html>
